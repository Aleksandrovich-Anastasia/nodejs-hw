<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reset your password</title>
  </head>
  <body>
    <p>Hi {{name}},</p>

    <p>
      You (or someone else) requested to reset your password. Click the link
      below to set a new password. The link is valid for 15 minutes.
    </p>

    <p>
      <a href="{{resetLink}}">Reset your password</a>
    </p>

    <p>If you didn't request this, just ignore this email.</p>

    <hr />
    <p>Thanks,<br />Your team</p>
  </body>
</html>
